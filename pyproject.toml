[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "martin-luk-trading-system"
version = "0.1.0"
description = "Evidence-led research scaffold for Martin Luk Trading System V1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["exchange-calendars==4.11.2", "pandas==2.3.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
